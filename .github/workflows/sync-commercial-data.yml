name: Sync commercial data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check schedule (resiliente a los saltos de cron de GitHub)
        id: schedule
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          # GitHub Actions NO dispara los cron puntualmente: atrasa o saltea
          # ticks. El gate viejo exigia local.hour in {8,13,20} exacto, asi que
          # un tick saltado = una ventana de sync perdida (paso el 28-jul-2026:
          # se salto la sincronizacion de las 08:00 Chile y las reuniones del
          # dia no aparecieron en el portal).
          #
          # Gate nuevo, tolerante: corre si es horario diurno en Chile (7-22) y
          # ya pasaron >=4.5h desde el ultimo sync exitoso. Asi cualquier tick
          # dentro de la ventana "alcanza" el sync perdido. El sync es idempotente
          # (upsert por ghl_appointment_id), asi que una corrida de mas no molesta.
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          MIN_HORAS_ENTRE_SYNCS = 4.5

          local = datetime.now(ZoneInfo("America/Santiago"))
          en_ventana = 7 <= local.hour <= 22

          run = False
          motivo = f"fuera de ventana diurna (hora Chile={local.hour})"
          if en_ventana:
              url = (
                  os.environ["SUPABASE_URL"].rstrip("/")
                  + "/rest/v1/sync_runs?select=created_at"
                  + "&entity=eq.reuniones&source=eq.ghl&status=eq.success"
                  + "&order=created_at.desc&limit=1"
              )
              key = os.environ["SUPABASE_SECRET_KEY"]
              req = urllib.request.Request(
                  url, headers={"apikey": key, "Authorization": f"Bearer {key}"}
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      rows = json.load(resp)
                  if rows:
                      last = datetime.fromisoformat(
                          rows[0]["created_at"].replace("Z", "+00:00")
                      )
                      horas = (datetime.now(timezone.utc) - last).total_seconds() / 3600
                      run = horas >= MIN_HORAS_ENTRE_SYNCS
                      motivo = f"ultimo sync hace {horas:.1f}h (umbral {MIN_HORAS_ENTRE_SYNCS}h)"
                  else:
                      run = True
                      motivo = "no hay sync previo registrado"
              except Exception as exc:  # ante la duda, sincronizar (es idempotente)
                  run = True
                  motivo = f"no se pudo leer sync_runs ({exc}); se corre por las dudas"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"run={'true' if run else 'false'}\n")
          print(f"Hora Chile: {local.isoformat()} · run={run} · {motivo}")

      - name: Install sync dependencies
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: pip install -r sync/requirements.txt

      - name: Check sync secrets
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GHL_AGENCY_TOKEN: ${{ secrets.GHL_AGENCY_TOKEN }}
          GHL_TOKEN_BAMBUTECH: ${{ secrets.GHL_TOKEN_BAMBUTECH }}
          GHL_LOCATION_BAMBUTECH: ${{ secrets.GHL_LOCATION_BAMBUTECH }}
          GHL_TOKEN_GBS_LOGISTICS: ${{ secrets.GHL_TOKEN_GBS_LOGISTICS }}
          GHL_LOCATION_GBS: ${{ secrets.GHL_LOCATION_GBS }}
          GHL_TOKEN_CLICKIE: ${{ secrets.GHL_TOKEN_CLICKIE }}
          GHL_LOCATION_CLICKIE: ${{ secrets.GHL_LOCATION_CLICKIE }}
        shell: python
        run: |
          import os
          import sys

          required = [
              "SUPABASE_URL",
              "SUPABASE_SECRET_KEY",
              "GHL_AGENCY_TOKEN",
              "GHL_TOKEN_BAMBUTECH",
              "GHL_LOCATION_BAMBUTECH",
              "GHL_TOKEN_GBS_LOGISTICS",
              "GHL_LOCATION_GBS",
              "GHL_TOKEN_CLICKIE",
              "GHL_LOCATION_CLICKIE",
          ]
          missing = [name for name in required if not os.getenv(name)]
          if missing:
              # Fallo VISIBLE: antes esto se saltaba en silencio y la corrida
              # quedaba en verde ("success"), por eso el sync estuvo semanas
              # caido sin que nadie lo notara. Ahora la corrida falla (rojo).
              print("::error::Sync abortado: faltan secrets de GitHub: " + ", ".join(missing))
              sys.exit(1)
          print("Todos los secrets presentes. Continuando con el sync.")

      - name: Sync BambuTech, GBS and Clickie
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GHL_AGENCY_TOKEN: ${{ secrets.GHL_AGENCY_TOKEN }}
          GHL_TOKEN_BAMBUTECH: ${{ secrets.GHL_TOKEN_BAMBUTECH }}
          GHL_LOCATION_BAMBUTECH: ${{ secrets.GHL_LOCATION_BAMBUTECH }}
          GHL_TOKEN_GBS_LOGISTICS: ${{ secrets.GHL_TOKEN_GBS_LOGISTICS }}
          GHL_LOCATION_GBS: ${{ secrets.GHL_LOCATION_GBS }}
          GHL_TOKEN_CLICKIE: ${{ secrets.GHL_TOKEN_CLICKIE }}
          GHL_LOCATION_CLICKIE: ${{ secrets.GHL_LOCATION_CLICKIE }}
        run: |
          python sync/scripts/sync_ghl.py --entity all --client-slug bambutech
          python sync/scripts/sync_meetings.py --client-slug bambutech
          python sync/scripts/sync_pipelines.py --client-slug bambutech
          python sync/scripts/sync_ghl.py --entity all --client-slug gbs
          python sync/scripts/sync_meetings.py --client-slug gbs
          python sync/scripts/sync_pipelines.py --client-slug gbs
          python sync/scripts/sync_ghl.py --entity all --client-slug clickie
          python sync/scripts/sync_meetings.py --client-slug clickie
          python sync/scripts/sync_pipelines.py --client-slug clickie
          python sync/scripts/derive_meetings_from_opportunities.py
          # Respaldo por calendario (iCal): agrega reuniones que GHL no trajo
          # (p.ej. si GHL estuvo caido). Se enlaza por event_id = ghl_appointment_id,
          # asi no duplica. Nunca debe tumbar el sync -> se ignora su error.
          python sync/scripts/sync_calendar_ics.py || echo "::warning::Respaldo iCal fallo (no critico)"

      - name: Sync SNOV email campaigns
        if: steps.schedule.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SNOV_CLIENT_ID: ${{ secrets.SNOV_CLIENT_ID }}
          SNOV_CLIENT_SECRET: ${{ secrets.SNOV_CLIENT_SECRET }}
        run: |
          # Campanias de correo Snov.io (campanas + metricas + eventos). La
          # atribucion a cada cliente sale de snov_campaign_map. Es no critico:
          # si faltan SNOV_CLIENT_ID/SECRET o la API falla, avisa en amarillo
          # pero NO tumba el sync de reuniones.
          python sync/scripts/sync_snov.py --include-events \
            || echo "::warning::Sync SNOV fallo (revisa secrets SNOV_CLIENT_ID / SNOV_CLIENT_SECRET)"
